name: Build

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v6
        with:
          path: src

      - name: Checkout Builds Branch
        uses: actions/checkout@v6
        with:
          ref: builds
          path: builds
          fetch-depth: 0

      - name: Clean Old Builds
        run: |
          find "$GITHUB_WORKSPACE/builds" \
            -maxdepth 1 -type f -name '*.cs3' -delete

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: src/**/*.gradle*

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools

      - name: Create Local Properties
        working-directory: src
        env:
          SIMKL_API: ${{ secrets.SIMKL_API }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          CASTLE_KEY: ${{ secrets.CASTLE_KEY }}
          MOVIEBLAST_TOKEN: ${{ secrets.MOVIEBLAST_TOKEN }}
          MOVIEBLAST_API: ${{ secrets.MOVIEBLAST_API }}
          MOVIEBLAST_KEY: ${{ secrets.MOVIEBLAST_KEY }}
        run: |
          touch local.properties
          {
            echo "SIMKL_API=$SIMKL_API"
            echo "TMDB_KEY=$TMDB_KEY"
            echo "CASTLE_KEY=$CASTLE_KEY"
            echo "MOVIEBLAST_TOKEN=$MOVIEBLAST_TOKEN"
            echo "MOVIEBLAST_API=$MOVIEBLAST_API"
            echo "MOVIEBLAST_KEY=$MOVIEBLAST_KEY"
          } >> local.properties

      - name: Build Plugins
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon make makePluginsJson

      - name: Collect Build Artifacts
        working-directory: src
        run: |
          set -e
          find . -type f -path '*/build/*.cs3' \
            -exec cp -f {} "$GITHUB_WORKSPACE/builds/" \;

          if [ -f build/plugins.json ]; then
            cp build/plugins.json "$GITHUB_WORKSPACE/builds/"
          else
            echo "ERROR: build/plugins.json was not generated"
            exit 1
          fi

      - name: Push Builds
        working-directory: builds
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Build ${GITHUB_SHA}"
            git push origin HEAD:builds
          else
            echo "No changes to push"
          fi
